# =====================================================================
#  DevSecOps learning pipeline
#  Stage numbers in comments match the flow diagram in README.md
# =====================================================================
name: DevSecOps Pipeline

# ---- STAGE 2 -> 3: a push (or PR) to GitHub starts the pipeline ----
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

# Least privilege by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

# Only one production deploy at a time
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: devsecops-demo
  GITLEAKS_VERSION: "8.24.3"

jobs:
  # -------------------------------------------------------------------
  # STAGE 4 + 5: Prepare environment, then scan the SOURCE code
  #   - Gitleaks  -> hardcoded secrets (API keys, passwords) in git history
  #   - Semgrep   -> SAST: insecure code patterns (XSS, eval, etc.)
  #   - npm audit -> SCA: known-vulnerable dependencies
  # Scans do NOT fail here. They write reports; the gate decides later.
  # -------------------------------------------------------------------
  code-scan:
    name: "5. Scan the code"
    runs-on: ubuntu-latest
    steps:
      - name: "4. Checkout (full history for secret scanning)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "4. Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: "4. Install dependencies"
        run: npm ci

      - name: Prepare reports folder
        run: mkdir -p reports

      - name: Secret scan (Gitleaks)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 0

      - name: SAST (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --config p/javascript \
            --json --output reports/semgrep.json --metrics=off || true

      - name: Dependency scan (npm audit)
        run: npm audit --json > reports/npm-audit.json || true

      - name: Upload code-scan reports
        uses: actions/upload-artifact@v4
        with:
          name: report-code-scan
          path: reports/

  # -------------------------------------------------------------------
  # STAGE 6: Build the application
  #   - lint, build static site into dist/
  #   - package it into an nginx container image (used for staging)
  # -------------------------------------------------------------------
  build:
    name: "6. Build the application"
    runs-on: ubuntu-latest
    needs: code-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Build container image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Save image to a file (so other jobs can use it)
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o image.tar

      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar
          retention-days: 1

  # -------------------------------------------------------------------
  # STAGE 7: Scan the BUILT artifact / container image
  #   - Trivy scans the image OS packages + nginx for known CVEs
  #     and misconfigurations
  # -------------------------------------------------------------------
  image-scan:
    name: "7. Scan the container"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-image

      - run: mkdir -p reports

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.75.0
        with:
          scan-type: image
          input: image.tar
          format: json
          output: reports/trivy-image.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload image-scan report
        uses: actions/upload-artifact@v4
        with:
          name: report-image-scan
          path: reports/

  # -------------------------------------------------------------------
  # STAGE 8 + 9: Deploy to STAGING, then ATTACK it (DAST)
  #   GitHub Pages only hosts one site per repo, so staging is an
  #   ephemeral container running inside the runner. It exists only
  #   for this job, which is how many real pipelines do "review apps".
  #   OWASP ZAP baseline crawls it and checks for web vulnerabilities.
  # -------------------------------------------------------------------
  staging-dast:
    name: "8-9. Deploy to staging + attack it"
    runs-on: ubuntu-latest
    needs: image-scan
    environment: staging
    steps:
      - uses: actions/checkout@v4        # needed for .zap/rules.tsv

      - uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: "8. Deploy to STAGING (run the container)"
        run: |
          docker load -i image.tar
          docker run -d --name staging -p 8080:8080 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # wait until it answers
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/ > /dev/null && echo "Staging is up" && exit 0
            sleep 1
          done
          echo "Staging did not start"; docker logs staging; exit 1

      - name: "9. Smoke test"
        run: |
          curl -fsS http://localhost:8080/ | grep -q "Pipeline" && echo "Smoke test passed"
          curl -fsS http://localhost:8080/build.json

      - name: "9. Attack it (OWASP ZAP baseline scan)"
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-raw

      - name: Collect ZAP report
        if: always()
        run: |
          mkdir -p reports
          cp report_json.json reports/zap.json 2>/dev/null || echo '{"site":[]}' > reports/zap.json
          cp report_html.html reports/zap.html 2>/dev/null || true

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-dast
          path: reports/

      - name: Tear down staging
        if: always()
        run: docker rm -f staging || true

  # -------------------------------------------------------------------
  # STAGE 10 + 11: Collect all findings and make the security decision
  #   Reads every report, counts findings by severity, writes a summary
  #   table to the run page, and FAILS if the policy is broken.
  # -------------------------------------------------------------------
  security-gate:
    name: "10-11. Collect findings + security decision"
    runs-on: ubuntu-latest
    needs: [code-scan, image-scan, staging-dast]
    steps:
      - uses: actions/checkout@v4

      - name: "10. Collect all reports"
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - name: "11. Security decision"
        run: bash scripts/security-gate.sh reports

      - name: Upload combined findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-security-findings
          path: reports/

  # -------------------------------------------------------------------
  # PASS -> PRODUCTION (GitHub Pages)
  #   Only on pushes to main, never on pull requests.
  # -------------------------------------------------------------------
  deploy-production:
    name: "PASS -> Deploy to production"
    runs-on: ubuntu-latest
    needs: [build, security-gate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------------
  # FAIL -> FIX ISSUES
  #   Opens a GitHub issue pointing to the failed run so someone fixes it.
  # -------------------------------------------------------------------
  fix-issues:
    name: "FAIL -> Open a fix-it issue"
    runs-on: ubuntu-latest
    needs: security-gate
    if: failure() && github.event_name != 'pull_request'
    permissions:
      issues: write
    steps:
      - name: Create issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Security gate failed on ${GITHUB_SHA::7}" \
            --body "The security gate blocked production for commit ${{ github.sha }}.

          Run with full findings: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Download the **all-security-findings** artifact from that run, fix the issues, and push again."
